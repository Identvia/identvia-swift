name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { swift: ['5.10', '6.0'] }
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
      - name: Build for iOS
        run: xcodebuild -scheme Identvia -destination 'generic/platform=iOS Simulator' build
      - name: Build for macOS
        run: xcodebuild -scheme Identvia -destination 'platform=macOS' build
