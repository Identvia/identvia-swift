name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded runs on PR branches; every push to main runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: { swift: ['5.10', '6.0'] }
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
  apple:
    # Runs after Linux passes so a broken change doesn't also burn a scarce macOS runner.
    needs: linux
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - run: swift build
      - run: swift test
      - name: Build for iOS
        run: xcodebuild -scheme Identvia -destination 'generic/platform=iOS Simulator' build
      - name: Build for macOS
        run: xcodebuild -scheme Identvia -destination 'platform=macOS' build
